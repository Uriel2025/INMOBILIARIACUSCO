<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMOBILIARIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">INMOBILIARIA <span>Cusco</span></div>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#propiedades">Propiedades</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Portada -->
    <section class="hero" id="inicio">
        <div class="hero-content">
            <h1>Encuentra tu hogar ideal</h1>
            <p>Venta y alquiler de propiedades exclusivas</p>
            <a href="#propiedades" class="btn">Ver propiedades</a>
        </div>
    </section>

    <!-- Propiedades -->
    <section class="propiedades" id="propiedades">
        <h2>Nuestras Propiedades</h2>
        <div class="propiedades-grid">
            <!-- Ejemplo: Añade más propiedades copiando este bloque -->
            <div class="propiedad">
                <img src="imagenes/casa1.jpg" alt="Casa en Cusco">
                <h3>Casa en el Centro</h3>
                <p>$250,000</p>
                <button class="btn">Me interesa</button>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
